[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrophysical-hydrodynamics"
version = "0.1.0"
description = "Finite-volume solvers for compressible astrophysical hydrodynamics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
